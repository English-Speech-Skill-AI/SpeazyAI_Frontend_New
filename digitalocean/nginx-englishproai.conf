# englishproai.intelliviq.com — SPA frontend (deploy target: /var/www/englishproai)
# After DNS points here, run setup-englishproai-nginx.sh on the droplet once for SSL.

server {
    listen 80;
    listen [::]:80;
    server_name englishproai.intelliviq.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name englishproai.intelliviq.com;

    root /var/www/englishproai;
    index index.html;

    # Certbot will fill these on first run:
    # ssl_certificate /etc/letsencrypt/live/englishproai.intelliviq.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/englishproai.intelliviq.com/privkey.pem;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|mp3)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
